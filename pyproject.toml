[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marpx-builder"
version = "0.1.0"
description = "A Python builder for Marp presentations using MarpX themes"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Jinja2>=3.0",
    "PyYAML>=6.0"
]

[project.scripts]
marpx-builder = "marpx_builder.cli:main"

[tool.setuptools.packages.find]
include = ["marpx_builder*"]

[tool.setuptools.package-data]
marpx_builder = ["themes/marpx/**/*.css", "themes/marpx/**/*.js"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff"
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
